name: EVPN-test

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest
    
      binds:
        - leaf1/config.sh:/config.sh

      exec:
        - chmod +x /config.sh
        - /config.sh

    leaf2:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - leaf2/config.sh:/config.sh

      exec:
        - chmod +x /config.sh
        - /config.sh

    spine1:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - spine1/config.sh:/config.sh
      exec:
        - chmod +x /config.sh
        - /config.sh
    host1:
      kind: linux
      image: alpine:latest

        #exec:

    host2:
      kind: linux
      image: alpine:latest

        #exec:

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "host1:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth1"]

