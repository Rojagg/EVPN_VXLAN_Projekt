name: EVPN-test

topology:
  nodes:

    leaf1:
      kind: linux
      image: frrouting/frr:latest
    
      binds:
        - leaf1/config1_2.sh:/config.sh

      exec:
        - chmod +x /config.sh
        - /config.sh

    leaf2:
      kind: linux
      image: frrouting/frr:latest

      binds:
        - leaf2/config1_2.sh:/config.sh

      exec:
        - chmod +x /config.sh
        - /config.sh


    host1:
      kind: linux
      image: alpine:latest

        #exec:

    host2:
      kind: linux
      image: alpine:latest

        #exec:

  links:
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "host1:eth1"]
    - endpoints: ["leaf2:eth2", "host2:eth1"]

